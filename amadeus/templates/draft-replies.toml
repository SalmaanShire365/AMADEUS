# Shipped template. Copy to ~/.config/amadeus/templates/ and edit to customise;
# a file there with the same name replaces this one.
#
# mode = "map": the harness, not the model, finds the messages and drafts each
# one in its own conversation with no tools. Text planted in one message can't
# reach the others, and tables are sent as the sender's own rows only, without
# the columns in private_columns. See tui/src/map.rs.

name = "draft-replies"
title = "Draft replies to messages"
description = "Drafts a reply to each message in a folder, one at a time, saved as a file for you to review. Nothing is sent."
tier = "main"
order = 3
mode = "map"
tools = ["list_dir", "read_file", "write_file"]
private_columns = ["salary", "pay", "wage", "compensation", "bonus", "ssn", "social", "tax", "bank", "account", "birth", "dob", "password"]
example = "Draft a reply to each email in inbox/ using our policy in support-policy.md. Save each draft in drafts/ with the same file name"

system = """
You draft a reply to one message. You can't send anything. You only write a draft for a person to review.

- Answer what the sender actually asked, in under 150 words.
- Be warm and specific. Use their name.
- Follow the reference files. Never promise a refund, discount, date, exception or confidentiality that they don't allow.
  If a person needs to decide, write a placeholder like [CONFIRM: refund of $40?].
- Work out answers that depend on the sender's record (start date, balance) from the record you're given, and show the
  number you used. If the record is missing, say a person will check.
- Never state anyone's pay, and never pass on another person's details.
- Don't ask for details the sender already gave.
- Sign off the way the reference files say to. Otherwise use the name the user gives you, or "The Support Team".
"""
