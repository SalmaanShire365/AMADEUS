[package]
name = "amadeus"
version = "0.1.0"
edition = "2021"
description = "Terminal UI front end for AMADEUS"

[[bin]]
name = "amadeus-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ratatui = "0.29"
serde_json = "1"
textwrap = "0.16"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 2
strip = true