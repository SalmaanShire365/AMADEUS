[package]
name = "amadeus"
version = "0.2.0"
edition = "2021"
description = "Terminal UI front end for AMADEUS"

[[bin]]
name = "amadeus-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "=0.2.189"
pulldown-cmark = { version = "=0.13.5", default-features = false }
ratatui = "0.29"
serde_json = "1"
textwrap = "0.16"
unicode-width = "=0.2.0"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 2
strip = true
